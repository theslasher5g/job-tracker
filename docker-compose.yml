services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs
      POSTGRES_DB: jobs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs -d jobs"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://jobs:jobs@db:5432/jobs
      REFRESH_HOURS: "6"   # wie oft neue Stellen geholt werden
      # Optional: eigene Firmen-Karriereseiten (Slug aus boards.greenhouse.io/<slug> bzw. jobs.lever.co/<slug>), kommagetrennt:
      # GREENHOUSE_BOARDS: "gitlab,cloudflare,meinefirma"
      # LEVER_COMPANIES: "palantir,meinefirma"
      # Weitere Karriereseiten-Systeme (alle optional, kommagetrennt, Slug aus der Karriereseiten-URL):
      # ASHBY_BOARDS: "firma"              -> jobs.ashbyhq.com/firma
      # WORKABLE_ACCOUNTS: "firma"         -> apply.workable.com/firma
      # RECRUITEE_COMPANIES: "firma"       -> firma.recruitee.com
      # SMARTRECRUITERS_COMPANIES: "Firma" -> jobs.smartrecruiters.com/Firma (Gross-/Kleinschreibung beachten)
      # PERSONIO_COMPANIES: "firma"        -> firma.jobs.personio.de
      REMOTE_SCOPE: world  # world = Remote-Stellen aus aller Welt, europe = nur Europa/weltweit
      # Optional und kostenpflichtig (ca. £8/Monat, 25 Test-Abrufe gratis): Key von https://developer.adzuna.com -> mehr Schweizer Stellen.
      # Eintragen in eine Datei .env neben docker-compose.yml: ADZUNA_APP_ID=... und ADZUNA_APP_KEY=...
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      # Optional: Jooble-Key (Schweiz-Stellen, API-Zugang auf jooble.org/api/about beantragen; Bedingungen vorher prüfen)
      JOOBLE_KEY: ${JOOBLE_KEY:-}
    ports:
      - "127.0.0.1:8080:8080"   # nur von diesem PC aus erreichbar (keine Anmeldung eingebaut)
    restart: unless-stopped

volumes:
  pgdata:
